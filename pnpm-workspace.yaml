packages:
  - apps/*
  - packages/*

# 引擎边界（AGENTS.md 规则 2，ADR-0004 补记 3）：node_modules/.bin 里的命令 shim 默认把
# node_modules/.pnpm/node_modules（所有依赖的私有提升目录）写进 NODE_PATH，
# 经 shim 启动的 Vitest 等进程里 require()/createRequire() 能解析到包内没声明的依赖，生产里则解析不到。
# 关掉它让 shim 启动的进程与纯 node 一致。只在创建 shim 时生效：改了这一行要 pnpm install --force。
extendNodePath: false

# 依赖的构建脚本逐个审查（ADR-0004 §2）：strictDepBuilds 保持默认开启，未登记的构建脚本让安装失败；
# 不用 dangerouslyAllowAllBuilds。键带精确版本，依赖升级换了版本就要重新审查一次。
allowBuilds:
  # 下面 2 个来自桌面端的构建工具（T5.1）：0.25.12 是 electron-vite 5 的依赖（打包 main / preload 的配置），
  # 0.28.2 是 Vite 7（桌面端）与 Vite 8（Vitest）的依赖。
  # 允许：postinstall 核对平台可选包 @esbuild/<平台> 里的二进制版本，非 Windows 上用它替换 bin/esbuild
  # 的 JS 转发脚本；可选包缺失时才从 npm registry 下载同版本的二进制。与 OpenWork 的取舍一致。
  esbuild@0.25.12: true
  esbuild@0.28.2: true
  # 拒绝：electron-builder 26.17.0 经 electron-builder-squirrel-windows 带进来，install 只把本机架构的
  # vendor/7z-<arch>.exe 复制成 7z.exe，只有 Squirrel.Windows 目标用得到；Wevir 的 Windows 安装包是 NSIS。
  electron-winstaller@5.4.0: false

# 不装的可选依赖。Claude Agent SDK 带各平台约 225 MB 的 Claude Code 原生二进制（@anthropic-ai/claude-agent-sdk-<平台>）；
# Wevir 照 T3 Code 用用户自己装的 `claude`（适配器总是传 pathToClaudeCodeExecutable，AGENTS.md 规则 2，ADR-0005 补记 14），
# 用不到随包的那一份。
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'

# 依赖声明的修正。Claude Agent SDK 的 sdk.mjs 不 import @modelcontextprotocol/sdk，只在 sdk.d.ts 里用它的类型（Wevir 不给 SDK
# 传 MCP 服务器）；当作必需的 peer 时 pnpm 会自动装上它，其他包里同名的可选 peer 随之解析到它，改动那些包的依赖。
# 标成可选，引擎之间互不影响（AGENTS.md 规则 2）。
packageExtensions:
  '@anthropic-ai/claude-agent-sdk@0.3.286':
    peerDependenciesMeta:
      '@modelcontextprotocol/sdk':
        optional: true

# 依赖补丁（pnpm patch，键带精确版本，升级时重新核对还需不需要）。
patchedDependencies:
  # 桌面端的“变更”窗格（0.20.0）：Pierre 把 diff 的行写成带 style 属性的 HTML（grid-row 的跨行、行号列宽、高亮的颜色），
  # 渲染进程的 CSP 不放行 HTML 里的 style 属性（apps/desktop/src/shared/csp.ts）。补丁在 FileDiff.js（U32 起还有文件预览用的
  # File.js）写 HTML 之前把 Pierre 自己的 HAST 里的 style 挪到 data-csp-style（不触发违规），写完经 CSSOM 原样补上；另把分隔条上写死的英文
  # （“N unmodified lines”等）换成可由使用方设置的 setDiffsText（新文件 utils/diffsText.js，从包入口导出），文案走 i18n。
  '@pierre/diffs@1.5.1': patches/@pierre__diffs@1.5.1.patch
  # 桌面端（U3，ADR-0004 补记 9）：最后一个 MetalFx 卸载时库调 loseContext()，那次异步的 webglcontextlost 回调写的是
  # 模块级的共享状态，同一次提交里新建的实例（切换会话时输入框重挂）拿到的新状态被标成“上下文丢失”，永远
  # visibility:hidden，发送按钮整个不见。补丁让两个回调只认自己那块画布。只改 ESM 产物（渲染进程只用它）。
  metal-fx@2.0.11: patches/metal-fx@2.0.11.patch
