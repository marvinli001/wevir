# 办公文档预览引擎搬到三条下载线路（apps/desktop/scripts/release.ts office-engine）：从 npmjs 下载
# packages/host/src/office/engine.ts 包表里所有平台的包，按写死的 sha512 核对，原样传到 GitHub Release（tag office-engine）、
# dl.edgeweir.com（R2）与 download.wevir.si（Bunny）的 office-engine/，再读回核对。
#
# 只在改了那张包表（升级 libreoffice-kit）后手动跑一次；Host 下载时这几条线路与 npm registry 一起竞速。线路的 secret 与
# variable 与 release.yml 的上传一步相同。

name: Office preview engine

on:
  workflow_dispatch:
    inputs:
      only:
        description: 只传这一条线路（默认全部）
        type: choice
        options: [all, github, r2, global]
        default: all

concurrency:
  group: office-engine
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    name: 上传预览引擎
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # release.ts 的这个子命令只用 Node 自带的模块，不装依赖。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 上传到 GitHub Release、dl.edgeweir.com（R2）与 download.wevir.si（Bunny）
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          WEVIR_R2_S3_ENDPOINT: ${{ vars.WEVIR_R2_S3_ENDPOINT }}
          WEVIR_R2_S3_REGION: ${{ vars.WEVIR_R2_S3_REGION || 'auto' }}
          WEVIR_R2_S3_BUCKET: ${{ vars.WEVIR_R2_S3_BUCKET }}
          WEVIR_R2_S3_ACCESS_KEY_ID: ${{ secrets.WEVIR_R2_S3_ACCESS_KEY_ID }}
          WEVIR_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_R2_S3_SECRET_ACCESS_KEY }}
          WEVIR_GLOBAL_S3_ENDPOINT: ${{ vars.WEVIR_GLOBAL_S3_ENDPOINT }}
          WEVIR_GLOBAL_S3_REGION: ${{ vars.WEVIR_GLOBAL_S3_REGION }}
          WEVIR_GLOBAL_S3_BUCKET: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_ACCESS_KEY_ID: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          aws --version
          args=()
          if [ "$ONLY" != all ]; then args=(--only "$ONLY"); fi
          node apps/desktop/scripts/release.ts office-engine "${args[@]}"
