# 发布（ADR-0007 补记 2 的第 3 步）：构建安装包，签更新清单，上传到三条下载线路（主线路 GitHub Release 与 Cloudflare R2，后备 Bunny）。
#
# - 开发版：master 上的 CI 跑完后自动发（workflow_run）。版本 X.Y.(Z+1)-beta.N，见 apps/desktop/scripts/release.ts plan。
# - 正式版：维护者决定发布时在 master 的提交上打 tag `vX.Y.Z` 并推送；要求这个提交在 master 上、CI 已经通过。
#   正式版另建 GitHub Release（备用下载）。
#
# 命令行包（cli 作业，apps/cli/scripts/package.ts）在同样三条线路的 cli/ 下，布局见 release.ts 的 publishCli。
#
# 产物按 src/main/updates/feed.ts 的布局放在每条线路的 desktop/<平台>-<架构>/（GitHub 线路是 tag desktop-updates 的
# 预发布 Release，清单名前加平台目录）：先传安装包，所有线路都成功后再写
# 清单与签名，清单只许更高的版本覆盖（release.ts publish）。同一时间只跑一个发布，后来的排队；排队的只保留最新一个，
# 连续提交时中间的开发版自然跳过。
#
# 要的仓库 secret 与 variable 见 docs/development.md §3.7。

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: 版本
    # 仓库 variable WEVIR_RELEASE=on 时才发（secret 配齐之前不跑）。开发版只看 master 的 push 触发的 CI
    # （不含 PR 与 tag 触发的 CI）；CI 通不通过由下面的 ci 一步判断。
    if: >-
      vars.WEVIR_RELEASE == 'on' && (github.event_name == 'push' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      skip: ${{ steps.plan.outputs.skip == 'true' || steps.ci.outputs.ok != 'true' }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 正式版的提交要在 master 上
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/master || { echo "::error::$GITHUB_REF_NAME 不在 master 上"; exit 1; }

      # 开发版看触发这次的 CI 运行；正式版看这个提交最近一次跑完的 CI。没有成功时：开发版跳过（不算失败），正式版报错。
      - id: ci
        name: CI 通过
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            CONCLUSION=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          fi
          echo "CI: ${CONCLUSION:-没有跑完的 CI}"
          if [ "$CONCLUSION" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "::error::$SHA 的 CI 还没有通过，等 CI 过了再推 tag"; exit 1; fi
            echo "::notice::CI 没有通过，这次不发开发版"
          fi

      - id: plan
        run: node apps/desktop/scripts/release.ts plan "${{ steps.sha.outputs.sha }}"

  build:
    name: 打包 ${{ matrix.dir }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, dir: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, dir: darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, dir: win32-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, dir: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 应用图标是 Icon Composer 工程（electron-builder.yml 的 mac.icon），要 Xcode 26 起的 actool 编译成 Assets.car，图标才会在
      # 应用没启动时跟随系统的深色外观。镜像里默认选的 Xcode 可能更旧：有 Xcode 26 就切过去；没有时 package.ts 改用浅色 ICNS。
      - name: 选用 Xcode 26（macOS）
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          actool --version || echo "没有可用的 actool"

      # package.ts 的 --app-version 写进安装包（extraMetadata.version）；electron-builder.yml 的 publish 让它写出更新清单
      # （latest-mac.yml / beta.yml 等，通道由版本的预发布标签决定），package.ts 固定 --publish never，上传由 publish 作业做。
      - name: 打包（macOS：签名、公证）
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm --filter @wevir/desktop package --target ${{ matrix.target }} --app-version ${{ needs.plan.outputs.version }}
          rm -f "$APPLE_API_KEY"

      - name: 打包（Windows，不签名）
        if: runner.os == 'Windows'
        run: pnpm --filter @wevir/desktop package --target ${{ matrix.target }} --app-version ${{ needs.plan.outputs.version }}

      # 用户终端的 node-pty 在 Linux 上没有预编译：在 Debian 11（glibc 2.31）的容器里编，比 runner 的 Ubuntu 旧，安装包在
      # 旧发行版上也能加载；stage-resources.ts 从 .wevir-dev/node-pty/ 放进资源目录。容器里是 root，编完把文件交还给 runner 的用户。
      - name: 编 node-pty（Linux）
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo node:24-bullseye \
            bash -c 'bash scripts/build-node-pty.sh && chown -R '"$(id -u):$(id -g)"' .wevir-dev node_modules/.pnpm/node-pty@*'

      # AppImage 与 deb（electron-builder.yml 的 linux 段），不签名。打 deb 的 fpm 与打 AppImage 的工具由 electron-builder 按架构
      # 下载。最后核对用户终端的 pty.node 进了安装包（没有时 ls 失败，这一步失败）。
      - name: 打包（Linux，不签名）
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @wevir/desktop package --target ${{ matrix.target }} --app-version ${{ needs.plan.outputs.version }}
          pty=$(ls apps/desktop/release/linux-*unpacked/resources/host/node_modules/node-pty/prebuilds/linux-*/pty.node)
          echo "用户终端：$pty"

      - name: 检查签名与公证
        if: runner.os == 'macOS'
        working-directory: apps/desktop/release
        run: |
          app=$(ls -d mac*/Wevir.app | head -1)
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            apps/desktop/release/Wevir-*.dmg
            apps/desktop/release/Wevir-*.zip
            apps/desktop/release/Wevir-*.exe
            apps/desktop/release/Wevir-*.AppImage
            apps/desktop/release/Wevir-*.deb
            apps/desktop/release/Wevir-*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/beta*.yml

  # 命令行包（apps/cli/scripts/package.ts，自带 Node，不装桌面端也能用）：每个平台在自己的 runner 上打，解开跑一遍
  # host start / status / stop（echo 引擎，不用模型），产物交给 publish。macOS 的 x64 包在 arm64 的 runner 上打，不跑。
  cli:
    name: 命令行包 ${{ matrix.dir }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, dir: linux-x64, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-arm64, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, dir: darwin-arm64, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, dir: darwin-x64, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, dir: win32-x64, smoke: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 包里的 Host 来自 packages/host 的 dist/（stage-resources.ts 的 stageHost），CLI 从源码打。
      - name: Build
        run: pnpm --filter "@wevir/host..." build

      - name: 打包
        run: pnpm --filter @wevir/cli package --target ${{ matrix.target }} --version ${{ needs.plan.outputs.version }}

      - name: 解开试运行
        if: matrix.smoke
        working-directory: ${{ runner.temp }}
        env:
          NAME: wevir-cli-${{ needs.plan.outputs.version }}-${{ matrix.dir }}
          RELEASE: ${{ github.workspace }}/apps/cli/release
          WEVIR_HOME: ${{ runner.temp }}/wevir-home
        run: |
          rm -rf "$NAME"
          if [ "$RUNNER_OS" = Windows ]; then
            /c/Windows/System32/tar.exe -xf "$(cygpath -w "$RELEASE/$NAME.zip")"
            wevir() { cmd //c "$(cygpath -w "$PWD/$NAME/bin/wevir.cmd")" "$@"; }
          else
            tar -xzf "$RELEASE/$NAME.tar.gz"
            wevir() { "$PWD/$NAME/bin/wevir" "$@"; }
          fi
          test "$(wevir --version)" = "${{ needs.plan.outputs.version }}"
          wevir host start --adapter echo
          wevir host status
          wevir host stop

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            apps/cli/release/wevir-cli-*.tar.gz
            apps/cli/release/wevir-cli-*.zip

  publish:
    name: 上传（${{ needs.plan.outputs.channel }} ${{ needs.plan.outputs.version }}）
    needs: [plan, build, cli]
    # 命令行包打失败时桌面端照发，只是不传命令行包（下面带 needs.cli.result 的几步）。
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # 全球线路要经 CDN 核对每个安装包，再等其他地区的存储副本跟上（release.ts 的 waitForCdn、CDN_SETTLE_MS）。
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # release-dir.ts 用到桌面端的 js-yaml、semver。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --filter @wevir/desktop

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release

      - uses: actions/download-artifact@v8
        if: needs.cli.result == 'success'
        with:
          pattern: cli-*
          path: cli-release
          merge-multiple: true

      # 每个平台的产物放回 apps/desktop/release/，由 release-dir.ts 整理成 site/desktop/<平台>-<架构>/ 并签清单
      # （用 keys.ts 的公钥核对，对不上就失败）。私钥只进这个作业。
      - name: 整理发布目录、签更新清单
        env:
          WEVIR_UPDATE_SIGNING_KEY: ${{ secrets.WEVIR_UPDATE_SIGNING_KEY }}
        run: |
          for d in release/release-*; do
            rm -rf apps/desktop/release && mkdir -p apps/desktop/release
            cp "$d"/* apps/desktop/release/
            node apps/desktop/scripts/release-dir.ts --out site --target "${d#release/release-}" --key -
          done
          ls -lR site

      - name: 上传到 GitHub Release、dl.edgeweir.com（R2）与 download.wevir.si（Bunny）
        env:
          GH_TOKEN: ${{ github.token }}
          WEVIR_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          WEVIR_R2_S3_ENDPOINT: ${{ vars.WEVIR_R2_S3_ENDPOINT }}
          WEVIR_R2_S3_REGION: ${{ vars.WEVIR_R2_S3_REGION || 'auto' }}
          WEVIR_R2_S3_BUCKET: ${{ vars.WEVIR_R2_S3_BUCKET }}
          WEVIR_R2_S3_ACCESS_KEY_ID: ${{ secrets.WEVIR_R2_S3_ACCESS_KEY_ID }}
          WEVIR_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_R2_S3_SECRET_ACCESS_KEY }}
          WEVIR_GLOBAL_S3_ENDPOINT: ${{ vars.WEVIR_GLOBAL_S3_ENDPOINT }}
          WEVIR_GLOBAL_S3_REGION: ${{ vars.WEVIR_GLOBAL_S3_REGION }}
          WEVIR_GLOBAL_S3_BUCKET: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_ACCESS_KEY_ID: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          aws --version
          node apps/desktop/scripts/release.ts publish --channel ${{ needs.plan.outputs.channel }} \
            --version ${{ needs.plan.outputs.version }} --dir site/desktop --skip-prune

      # 命令行包传到同样三条线路的 cli/（GitHub 线路是 tag cli 的 Release），写校验和、安装脚本与通道文件（release.ts cli）。
      - name: 上传命令行包
        if: needs.cli.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WEVIR_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          WEVIR_R2_S3_ENDPOINT: ${{ vars.WEVIR_R2_S3_ENDPOINT }}
          WEVIR_R2_S3_REGION: ${{ vars.WEVIR_R2_S3_REGION || 'auto' }}
          WEVIR_R2_S3_BUCKET: ${{ vars.WEVIR_R2_S3_BUCKET }}
          WEVIR_R2_S3_ACCESS_KEY_ID: ${{ secrets.WEVIR_R2_S3_ACCESS_KEY_ID }}
          WEVIR_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_R2_S3_SECRET_ACCESS_KEY }}
          WEVIR_GLOBAL_S3_ENDPOINT: ${{ vars.WEVIR_GLOBAL_S3_ENDPOINT }}
          WEVIR_GLOBAL_S3_REGION: ${{ vars.WEVIR_GLOBAL_S3_REGION }}
          WEVIR_GLOBAL_S3_BUCKET: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_ACCESS_KEY_ID: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          ls -l cli-release
          node apps/desktop/scripts/release.ts cli --channel ${{ needs.plan.outputs.channel }} \
            --version ${{ needs.plan.outputs.version }} --dir cli-release

      # 官网下载页在构建时读清单写进链接（线路不许跨域读时就只用它），所以每次发布后重建一次。清单一写完就触发，
      # 不等最后的清理（清理只删清单不再引用的旧版本）。
      - name: 重建官网
        env:
          WEVIR_SITE_DEPLOY_HOOK: ${{ secrets.WEVIR_SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$WEVIR_SITE_DEPLOY_HOOK" ]; then
            echo "::warning::WEVIR_SITE_DEPLOY_HOOK 没有设置，官网的下载链接要等下次部署才更新"
            exit 0
          fi
          curl -fsS -X POST "$WEVIR_SITE_DEPLOY_HOOK" > /dev/null
          echo "官网已触发重建"

      - name: GitHub Release（正式版）
        if: needs.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          cli=(cli-release/wevir-cli-*)
          gh release create "v${{ needs.plan.outputs.version }}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Wevir ${{ needs.plan.outputs.version }}" --generate-notes \
            release/release-*/Wevir-*.dmg release/release-*/Wevir-*.exe \
            release/release-*/Wevir-*.AppImage release/release-*/Wevir-*.deb "${cli[@]}"

      # 最后清理旧版本（每个平台开发版、正式版各留最新 2 个，再加清单引用的），放在官网重建之后，不拖慢新版本上线。
      - name: 清理旧版本
        env:
          GH_TOKEN: ${{ github.token }}
          WEVIR_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          WEVIR_R2_S3_ENDPOINT: ${{ vars.WEVIR_R2_S3_ENDPOINT }}
          WEVIR_R2_S3_REGION: ${{ vars.WEVIR_R2_S3_REGION || 'auto' }}
          WEVIR_R2_S3_BUCKET: ${{ vars.WEVIR_R2_S3_BUCKET }}
          WEVIR_R2_S3_ACCESS_KEY_ID: ${{ secrets.WEVIR_R2_S3_ACCESS_KEY_ID }}
          WEVIR_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_R2_S3_SECRET_ACCESS_KEY }}
          WEVIR_GLOBAL_S3_ENDPOINT: ${{ vars.WEVIR_GLOBAL_S3_ENDPOINT }}
          WEVIR_GLOBAL_S3_REGION: ${{ vars.WEVIR_GLOBAL_S3_REGION }}
          WEVIR_GLOBAL_S3_BUCKET: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_ACCESS_KEY_ID: ${{ vars.WEVIR_GLOBAL_S3_BUCKET }}
          WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY: ${{ secrets.WEVIR_GLOBAL_S3_SECRET_ACCESS_KEY }}
        run: node apps/desktop/scripts/release.ts prune --dir site/desktop
