body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wevir version
      description: e.g. 0.0.1-beta.420
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows x64
        - Source build
  - type: input
    id: source
    attributes:
      label: Model or subscription source
      description: e.g. DeepSeek API key, ChatGPT sign-in, Claude, Ollama
