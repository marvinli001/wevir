# wevir-push behind a TLS proxy you already run (a hosting platform's edge, Traefik, nginx): Compose builds the
# image from this repository and the proxy forwards HTTPS for the gateway's domain to port 8080. The proxy must
# append the client address to X-Forwarded-For (WEVIR_PUSH_TRUST_PROXY=1), and port 8080 must not be reachable
# from the internet directly, or clients could set that header themselves.
# Credentials are the service's own environment variables, set on the platform (or in an env_file you add), never in
# this file: WEVIR_PUSH_APNS_KEY with the .p8 contents, WEVIR_PUSH_APNS_KEY_ID, WEVIR_PUSH_APNS_TEAM_ID,
# WEVIR_PUSH_APNS_TOPIC and WEVIR_PUSH_FCM_CREDENTIALS. They are deliberately not listed under `environment`: an entry
# there takes precedence over variables the platform injects and would replace them with empty values.
services:
  push:
    build:
      context: ../../..
      dockerfile: apps/push/Dockerfile
    restart: unless-stopped
    environment:
      WEVIR_PUSH_TRUST_PROXY: "1"
    volumes:
      - push-data:/data
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  push-data:
