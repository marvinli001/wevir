# wevir-push behind Caddy, which gets and renews the TLS certificate.
# Set PUSH_DOMAIN to a name whose A/AAAA record points at this machine, put the credentials in ./secrets
# (never in this file or the image), then:
#   docker compose up -d
# Build the image first from the repository root:
#   docker build -f apps/push/Dockerfile -t wevir-push .
services:
  push:
    image: wevir-push
    restart: unless-stopped
    environment:
      WEVIR_PUSH_TRUST_PROXY: "1"
      WEVIR_PUSH_LOG_LEVEL: info
      WEVIR_PUSH_APNS_KEY_FILE: /run/secrets/apns_key
      WEVIR_PUSH_APNS_KEY_ID: ${APNS_KEY_ID:?set APNS_KEY_ID}
      WEVIR_PUSH_APNS_TEAM_ID: ${APNS_TEAM_ID:?set APNS_TEAM_ID}
      WEVIR_PUSH_APNS_TOPIC: ${APNS_TOPIC:?set APNS_TOPIC}
      WEVIR_PUSH_FCM_CREDENTIALS_FILE: /run/secrets/fcm_credentials
    secrets:
      - apns_key
      - fcm_credentials
    volumes:
      - push-data:/data
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUSH_DOMAIN: ${PUSH_DOMAIN:?set PUSH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - push

secrets:
  apns_key:
    file: ./secrets/AuthKey.p8
  fcm_credentials:
    file: ./secrets/fcm-service-account.json

volumes:
  push-data:
  caddy-data:
  caddy-config:
