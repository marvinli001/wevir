# OpenAI 兼容 Provider 的 --patch overlay 样例（Wevir T3.4 Provider 桥接的原型）。
# 用法：dsh --profile acp --patch <本文件>
# 密钥不写在这里：apiKeyEnv 只是环境变量名，Host 在 spawn dsh 时把 Key 放进子进程环境。
# spike 运行时由 src/overlays.ts 按 WEVIR_SPIKE_BASE_URL / WEVIR_SPIKE_MODEL 生成同结构的实际文件。

- id: llm-pi-ai
  config:
    providers:
      wevir-spike: # Provider ID：小写，写入会话日志与模型选择，创建后不可改名
        displayName: Wevir Spike
        apiKeyEnv: WEVIR_SPIKE_API_KEY
        api: openai-completions # 另有 openai-responses、anthropic-messages
        baseURL: https://gateway.example/v1
        # 非 OpenAI 官方地址时 pi-ai 按 OpenAI 自己的规则拼请求，大多数网关需要以下修正。
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: your-model-id

# acp 条目的 config 会被整体替换：provider/model 决定 ACP 新建会话使用的路由。
- id: acp
  config:
    provider: wevir-spike
    model: your-model-id
